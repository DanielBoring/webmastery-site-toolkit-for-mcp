name: 5 - Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release-qa:
    name: 5 - Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      source-sha: ${{ steps.metadata.outputs.source-sha }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout complete tag history without persistent credentials
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gate exact tag and current main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/release-tag-check.sh "$RELEASE_TAG"

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: zip
          tools: composer:v2
          coverage: none

      - name: Install locked development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Gate static and unit QA before packaging or production approval
        run: composer qa

      - name: Test release safeguard regressions
        run: |
          php scripts/test-release-safeguards.php
          bash scripts/test-release-tag-check.sh
          bash scripts/test-release-plugin-check.sh

      - name: Validate source metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(php scripts/release-tools.php version)"
          test "$RELEASE_TAG" = "v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build once and test the package with pinned and current Plugin Check
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          REQUIRE_CURRENT_PLUGIN_CHECK: '1'
        run: bash scripts/release-qa.sh "$RELEASE_VERSION"

      - name: Seal original ZIP, scoped notes, listing assets and source manifest
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          SOURCE_SHA: ${{ steps.metadata.outputs.source-sha }}
        run: |
          php scripts/release-tools.php bundle \
            "webmastery-site-toolkit-for-mcp-${RELEASE_VERSION}.zip" \
            build/release-bundle "$SOURCE_SHA" "$GITHUB_RUN_ID"

      - name: Upload immutable run-scoped validated bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release-bundle/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: 5 - Publish Release
    needs: release-qa
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Shared across every tag. GitHub retains only one pending run; this is NOT FIFO.
    # An active publish is never cancelled. Superseded pending runs must be rerun.
    concurrency:
      group: wordpress-org-production-publish
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    environment:
      name: wordpress-org
      url: https://wordpress.org/plugins/webmastery-site-toolkit-for-mcp/
    env:
      RELEASE_VERSION: ${{ needs.release-qa.outputs.version }}
      SOURCE_SHA: ${{ needs.release-qa.outputs.source-sha }}
    steps:
      - name: Checkout validated source without persistent credentials
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ needs.release-qa.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none

      - name: Download only this QA job's immutable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.release-qa.outputs.artifact-id }}
          path: build/release-bundle
          merge-multiple: true

      - name: Recheck ancestry and verify all artifact bytes after approval
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          bash scripts/release-tag-check.sh "v$RELEASE_VERSION"
          php scripts/release-tools.php verify build/release-bundle "$SOURCE_SHA" "$GITHUB_RUN_ID" "$RELEASE_VERSION"
          php scripts/release-tools.php extract build/release-bundle/package.zip build/publish
          cp build/release-bundle/package.zip "build/webmastery-site-toolkit-for-mcp-${RELEASE_VERSION}.zip"

      - name: Reject stale versions and inspect resumable publication state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-publish-check.sh preflight "$RELEASE_VERSION" build/release-bundle

      - name: Attest the exact ZIP before public exposure
        if: steps.state.outputs.decision != 'complete'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/webmastery-site-toolkit-for-mcp-${{ needs.release-qa.outputs.version }}.zip

      - name: Deploy only a previously unpublished, validated SVN tag
        id: deploy
        if: steps.state.outputs.decision == 'deploy'
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          generate-zip: false
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: webmastery-site-toolkit-for-mcp
          VERSION: ${{ needs.release-qa.outputs.version }}
          BUILD_DIR: build/publish/webmastery-site-toolkit-for-mcp
          ASSETS_DIR: build/release-bundle/assets

      - name: Verify SVN and bounded public listing propagation
        id: verify-public
        if: ${{ !cancelled() && steps.state.outcome == 'success' && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure' || steps.state.outputs.decision != 'deploy') }}
        run: bash scripts/release-publish-check.sh verify "$RELEASE_VERSION" build/release-bundle

      - name: Create missing GitHub Release using the original QA ZIP
        if: ${{ success() && steps.verify-public.outcome == 'success' && steps.state.outputs.decision != 'complete' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Recheck public versions and duplicates under the shared lock immediately before exposure.
          bash scripts/release-publish-check.sh preflight "$RELEASE_VERSION" build/release-bundle
          cmp build/release-bundle/package.zip "build/webmastery-site-toolkit-for-mcp-${RELEASE_VERSION}.zip"
          gh release create "v${RELEASE_VERSION}" \
            "build/webmastery-site-toolkit-for-mcp-${RELEASE_VERSION}.zip" \
            --verify-tag --title "v${RELEASE_VERSION}" --notes-file build/release-bundle/notes.md

      - name: Report failed or partial publication
        if: ${{ failure() && steps.state.outcome == 'success' }}
        run: |
          echo "::error::Publication may be partial. Do not retag or blindly redeploy. Rerun this workflow: matching SVN tags are verified and skipped, and existing GitHub ZIPs must match."
          echo "Publication incomplete. Inspect SVN/listing verification above; rerun continuation compares existing files and never overwrites a tag or GitHub release." >> "$GITHUB_STEP_SUMMARY"
