name: WordPress.org publishing checks

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publishing-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publishing-qa:
    name: Publishing checks (not product acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: wstm-publishing-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_ARTIFACTS_DIR: e2e-artifacts
      WSTM_QA_LOCATION: cloud
      REQUIRE_CURRENT_PLUGIN_CHECK: '1'
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none
      - name: Validate publishing requirements without product acceptance
        run: bash scripts/qa-run.sh publishing
      - name: Upload checker verdicts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publishing-checker-verdicts
          path: e2e-artifacts/plugin-check-*-verdict.json
          if-no-files-found: error
          retention-days: 7
