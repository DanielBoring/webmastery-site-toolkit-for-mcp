name: 5 - Release Package QA

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '23 7 * * *'

permissions: {}

concurrency:
  group: release-package-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should-run: ${{ steps.filter.outputs.should-run }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect product package changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QA_SCOPE: package
        run: bash scripts/qa-changes.sh >> "$GITHUB_OUTPUT"

  release-package-qa:
    name: 5 - Release Package QA
    needs: changes
    if: needs.changes.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none

      - name: Test release safeguard regressions
        run: |
          php scripts/test-release-safeguards.php
          bash scripts/test-release-tag-check.sh
          bash scripts/test-release-plugin-check.sh
          bash scripts/test-release-runtime.sh
          php scripts/test-release-recovery.php
          php scripts/test-release-checks-gate.php
          bash scripts/test-release-control-check.sh
          bash scripts/test-release-publish-prerequisites.sh

      - name: Run Release Package QA
        env:
          COMPOSE_PROJECT_NAME: wstm-package-qa-${{ github.run_id }}-${{ github.run_attempt }}
          E2E_ARTIFACTS_DIR: e2e-artifacts
        run: bash scripts/qa-run.sh package

      - name: Upload destructive safety package evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: destructive-safety-package-evidence
          path: e2e-artifacts/destructive-*/
          if-no-files-found: error
          retention-days: 7

      - name: Upload verified product package summary
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-qa-package-summary
          path: e2e-artifacts/product-qa.summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload input schema package evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: input-schema-package-evidence
          path: e2e-artifacts/input-schema-*/
          if-no-files-found: error
          retention-days: 7

      - name: Upload standalone metadata package evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: post-meta-authorization-package-evidence
          path: e2e-artifacts/post-meta-authorization-*.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload canonical error package evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: error-contract-package-evidence
          path: e2e-artifacts/error-contract.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload metadata boundary package evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metadata-boundary-package-evidence
          path: |
            e2e-artifacts/metadata-batch-*.json
            e2e-artifacts/seo-metadata-*.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload database privacy package evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-privacy-package-evidence
          path: |
            e2e-artifacts/database-table-privacy-native.json
            e2e-artifacts/database-table-privacy-http.json
          if-no-files-found: error
          retention-days: 7

  package-gate:
    name: Package QA gate
    needs: [changes, release-package-qa]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up gate PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none
      - name: Require successful detection and applicable package QA
        env:
          DETECTOR: ${{ needs.changes.result }}
          SHOULD_RUN: ${{ needs.changes.outputs.should-run }}
          RESULT: ${{ needs.release-package-qa.result }}
        run: php scripts/qa-check-gate.php "$DETECTOR" "$SHOULD_RUN" "$RESULT"
