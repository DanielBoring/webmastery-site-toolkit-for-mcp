name: 7 - Issue Backlog Import

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the import without creating issues
        required: true
        default: true
        type: boolean

concurrency:
  group: issue-backlog-import
  cancel-in-progress: false

permissions: {}

jobs:
  import-issues:
    name: Import issue backlog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Import issue backlog
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: bash scripts/import-issues.sh ISSUES "$DRY_RUN"
