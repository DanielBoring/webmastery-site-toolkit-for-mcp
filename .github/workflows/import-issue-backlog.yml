name: 7 - Issue Backlog Import

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the import without creating issues
        required: true
        default: true
        type: boolean

concurrency:
  group: issue-backlog-import
  cancel-in-progress: false

permissions: {}

jobs:
  import-issues:
    name: Import issue backlog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Import issue backlog
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: bash scripts/import-issues.sh ISSUES "$DRY_RUN"
