name: Fresh validation of immutable v3.0.0

on:
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    name: Validate original immutable v3.0.0 afresh
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    outputs:
      control-object: ${{ steps.control.outputs.control-tag-object }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      run-attempt: ${{ github.run_attempt }}
    steps:
      - name: Checkout reviewed control without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require annotated reviewed control tag in main
        id: control
        run: bash scripts/release-control-check.sh resolve

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: zip
          tools: composer:v2
          coverage: none

      - name: Admit reviewed control and locked original source
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_TAG_OBJECT: ${{ steps.control.outputs.control-tag-object }}
        run: php scripts/release-fresh-validation.php admit

      - name: Checkout only the locked original release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2f9842bb943fb27030cabe8060ad0b10c007ac14
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Test trusted fresh-validation safeguards
        run: php scripts/test-release-fresh-validation.php

      - name: Verify original checkout and metadata
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2f9842bb943fb27030cabe8060ad0b10c007ac14
          test "$(git rev-parse refs/tags/v3.0.0)" = 4bcc5bae61b7867bcb6f186713beeaeb5ed9b722
          bash scripts/release-tag-check.sh v3.0.0
          test "$(php scripts/release-tools.php version)" = 3.0.0

      - name: Install original locked development dependencies
        working-directory: source
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run original static and complete unit QA
        working-directory: source
        env:
          COMPOSER_PROCESS_TIMEOUT: '0'
        run: composer qa

      - name: Run original release safeguards
        working-directory: source
        env:
          COMPOSER_PROCESS_TIMEOUT: '0'
        run: composer test:release-safeguards

      - name: Build once and test original ZIP with both Plugin Check versions
        working-directory: source
        env:
          COMPOSE_PROJECT_NAME: wstm-fresh-release-${{ github.run_id }}-${{ github.run_attempt }}
          REQUIRE_CURRENT_PLUGIN_CHECK: '1'
        run: bash scripts/release-qa.sh 3.0.0

      - name: Recheck immutable identities and seal fresh provenance
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_TAG_OBJECT: ${{ steps.control.outputs.control-tag-object }}
          APPROVED_CONTROL_TAG_OBJECT: ${{ steps.control.outputs.control-tag-object }}
        run: |
          set -euo pipefail
          bash scripts/release-control-check.sh verify
          (cd source && bash scripts/release-tag-check.sh v3.0.0 &&
            php scripts/release-tools.php bundle \
              webmastery-site-toolkit-for-mcp-3.0.0.zip build/release-bundle \
              2f9842bb943fb27030cabe8060ad0b10c007ac14 "$GITHUB_RUN_ID")
          php scripts/release-fresh-validation.php seal source/build/release-bundle/manifest.json
      - name: Upload new immutable validated bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fresh-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: source/build/release-bundle/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Ready for protected fresh-validation approval
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          {
            echo "## Fresh validation ready for GitHub production approval"
            echo "This is a NEW validation/artifact, not recovery of the failed original run."
            echo "Original immutable release: v3.0.0 / 4bcc5bae61b7867bcb6f186713beeaeb5ed9b722."
            echo "Package source: 2f9842bb943fb27030cabe8060ad0b10c007ac14; control: ${GITHUB_SHA}."
            echo "New QA run ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT}; artifact ${ARTIFACT_ID}; digest ${ARTIFACT_DIGEST}."
            echo "Approve the wordpress-org deployment only after reviewing all mandatory gates."
            echo "Destinations: WordPress.org SVN and GitHub Releases, both 3.0.0, using only this ZIP."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish freshly validated original release (GitHub approval required)
    needs: validate
    if: ${{ !cancelled() && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: wordpress-org-production-publish
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    environment:
      name: wordpress-org
      url: https://wordpress.org/plugins/webmastery-site-toolkit-for-mcp/
    env:
      CONTROL_TAG_OBJECT: ${{ needs.validate.outputs.control-object }}
      APPROVED_CONTROL_TAG_OBJECT: ${{ needs.validate.outputs.control-object }}
      ARTIFACT_ID: ${{ needs.validate.outputs.artifact-id }}
      ARTIFACT_DIGEST: ${{ needs.validate.outputs.artifact-digest }}
      QA_RUN_ATTEMPT: ${{ needs.validate.outputs.run-attempt }}
    steps:
      - name: Checkout reviewed control again after approval
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Recheck approved control tag after approval
        run: bash scripts/release-control-check.sh verify

      - name: Set up publish tooling
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none

      - name: Revalidate fresh QA, artifact, actor and immutable tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: php scripts/release-fresh-validation.php verify-approved

      - name: Checkout validated original source without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2f9842bb943fb27030cabe8060ad0b10c007ac14
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Install and verify publish-host Subversion before first use
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends subversion
          command -v svn
          svn --version --quiet

      - name: Download only this fresh QA job's immutable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ env.ARTIFACT_ID }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: source/build/release-bundle
          merge-multiple: true

      - name: Verify fresh manifest and exact original package after approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          php scripts/release-fresh-validation.php verify-manifest source/build/release-bundle/manifest.json
          cd source
          test "$(git rev-parse HEAD)" = 2f9842bb943fb27030cabe8060ad0b10c007ac14
          bash scripts/release-tag-check.sh v3.0.0
          test "$(git rev-parse refs/tags/v3.0.0)" = 4bcc5bae61b7867bcb6f186713beeaeb5ed9b722
          test "$(git ls-remote --exit-code --tags origin refs/tags/v3.0.0 | cut -f1)" = 4bcc5bae61b7867bcb6f186713beeaeb5ed9b722
          php scripts/release-tools.php verify build/release-bundle 2f9842bb943fb27030cabe8060ad0b10c007ac14 "$GITHUB_RUN_ID" 3.0.0
          php scripts/release-tools.php extract build/release-bundle/package.zip build/publish
          cp build/release-bundle/package.zip build/webmastery-site-toolkit-for-mcp-3.0.0.zip

      - name: Reject stale versions and inspect resumable publication state
        id: state
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-publish-check.sh preflight 3.0.0 build/release-bundle

      - name: Attest exact freshly validated ZIP before public exposure
        if: steps.state.outputs.decision != 'complete'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: source/build/webmastery-site-toolkit-for-mcp-3.0.0.zip

      - name: Deploy only a previously unpublished validated SVN tag
        id: deploy
        if: steps.state.outputs.decision == 'deploy'
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          generate-zip: false
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: webmastery-site-toolkit-for-mcp
          VERSION: 3.0.0
          BUILD_DIR: source/build/publish/webmastery-site-toolkit-for-mcp
          ASSETS_DIR: source/build/release-bundle/assets

      - name: Verify SVN and bounded public listing propagation
        id: verify-public
        if: ${{ !cancelled() && steps.state.outcome == 'success' && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure' || steps.state.outputs.decision != 'deploy') }}
        working-directory: source
        run: bash scripts/release-publish-check.sh verify 3.0.0 build/release-bundle

      - name: Create missing GitHub Release using the fresh QA ZIP
        if: ${{ success() && steps.verify-public.outcome == 'success' && steps.state.outputs.decision != 'complete' }}
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/release-publish-check.sh preflight 3.0.0 build/release-bundle
          cmp build/release-bundle/package.zip build/webmastery-site-toolkit-for-mcp-3.0.0.zip
          gh release create v3.0.0 build/webmastery-site-toolkit-for-mcp-3.0.0.zip \
            --verify-tag --title v3.0.0 --notes-file build/release-bundle/notes.md

      - name: Report failed or partial fresh publication
        if: ${{ failure() && steps.state.outcome == 'success' }}
        run: |
          echo "::error::Publication may be partial. Preserve immutable tags and the fresh artifact; inspect destination hashes before any authorized continuation."
